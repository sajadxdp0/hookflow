name: Bug report
description: Report a reproducible defect in HookFlow.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include API keys, signing secrets, encryption keys, or customer payloads.
        For a suspected vulnerability, use [private vulnerability reporting](https://github.com/sajadxdp0/hookflow/security/advisories/new) instead of this form.

  - type: input
    id: version
    attributes:
      label: HookFlow version
      description: Enter the release version or commit SHA.
      placeholder: "0.2.0"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment mode
      options:
        - development
        - production
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - API
        - Worker / delivery
        - Dashboard
        - Database / migrations
        - Authentication / tenants
        - Redis / rate limiting
        - Docker / deployment
        - Documentation
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - SQLite
        - PostgreSQL
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is incorrect.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide a minimal sequence of commands or API requests. Redact all credentials and payload data.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what should have happened.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or responses
      description: Paste redacted logs, status codes, or response bodies. Use a fenced code block.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials and customer data from this report.
          required: true
