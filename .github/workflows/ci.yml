name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.10"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Test with coverage
        run: uv run --frozen pytest

  postgres:
    name: PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: hookflow
          POSTGRES_USER: hookflow
          POSTGRES_PASSWORD: hookflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://hookflow:hookflow@localhost:5432/hookflow
      HOOKFLOW_TEST_DATABASE_URL: postgresql+psycopg://hookflow:hookflow@localhost:5432/hookflow
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.10"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Migrate
        run: uv run --frozen alembic upgrade head
      - name: Test on PostgreSQL and Redis
        run: uv run --frozen pytest

  migrations:
    name: Migration drift and reverse checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/hookflow-migrations.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.10"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Migrations apply cleanly from empty
        run: |
          rm -f /tmp/hookflow-migrations.db
          uv run --frozen alembic upgrade head
      - name: No model or migration drift
        run: uv run --frozen alembic check
      - name: Migrations reverse and reapply cleanly
        run: |
          uv run --frozen alembic downgrade base
          uv run --frozen alembic upgrade head

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API and worker image
        run: docker build --file docker/Dockerfile --tag hookflow:ci .
      - name: Build dashboard image
        run: docker build --file dashboard/Dockerfile --tag hookflow-dashboard:ci .

  dashboard:
    name: Dashboard typecheck, build, and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.10"
          enable-cache: true
      - name: Export locked dependencies
        run: uv export --frozen --all-extras --no-emit-project --output-file /tmp/hookflow-locked-requirements.txt
      - name: Audit locked project dependencies
        run: uvx --from pip-audit==2.10.1 pip-audit --require-hashes --strict -r /tmp/hookflow-locked-requirements.txt
