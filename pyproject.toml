[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hookflow"
version = "0.2.0"
description = "Reliable webhook and event delivery infrastructure"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "sajadxdp" }]
keywords = [
    "webhooks",
    "webhook-delivery",
    "event-driven",
    "fastapi",
    "postgresql",
    "redis",
    "at-least-once",
    "dead-letter-queue",
    "reliability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.163.2",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy>=2.1.9",
    "psycopg[binary]>=3.3.9",
    "redis>=8.1.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "httpx>=0.28.1",
    "python-multipart>=0.0.34",
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-cov>=7,<8", "ruff>=0.14"]

[project.urls]
Homepage = "https://github.com/sajadxdp0/hookflow"
Repository = "https://github.com/sajadxdp0/hookflow"
Issues = "https://github.com/sajadxdp0/hookflow/issues"

[tool.setuptools.packages.find]
include = ["app*", "migrations*"]
namespaces = true

[tool.setuptools.package-data]
migrations = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-q --tb=short --cov=app --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.report]
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/*.py" = ["B008"]
